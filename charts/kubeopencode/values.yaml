# Default values for kubeopencode
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Controller configuration
controller:
  # Container image for kubeopencode (unified image with controller, git-init)
  image:
    repository: ghcr.io/kubeopencode/kubeopencode
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # Number of controller replicas (only 1 active with leader election)
  replicas: 1

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Service account for the controller
  serviceAccount:
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # Security context for controller pods
  podSecurityContext:
    runAsNonRoot: true
    # runAsUser: 65532

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL

  # Node selector for controller pods
  nodeSelector: {}

  # Tolerations for controller pods
  tolerations: []

  # Affinity for controller pods
  affinity: {}

# Agent configuration
# NOTE: Agent ServiceAccount is NOT created by this chart.
# Users must create their own ServiceAccount and RBAC in each namespace where tasks run,
# and reference it in Agent.spec.serviceAccountName (required field).
# NOTE: Agent images are configured in Agent CRDs, not in this Helm chart.
# The two-container pattern uses:
#   - agentImage: Init container with the coding agent CLI
#   - executorImage: Worker container (default: ghcr.io/kubeopencode/kubeopencode-agent-devbox)
# Runtime-specific agent images:
#   - OpenCode (default): ghcr.io/kubeopencode/kubeopencode-agent-opencode
#   - Crush: ghcr.io/kubeopencode/kubeopencode-agent-crush
agent:
  # Default image settings (used for local development with Kind)
  # Runtime-specific agent images are configured in Agent CRDs:
  #   - OpenCode (default): ghcr.io/kubeopencode/kubeopencode-agent-opencode
  #   - Crush: ghcr.io/kubeopencode/kubeopencode-agent-crush
  #   - executorImage: Worker container (default: ghcr.io/kubeopencode/kubeopencode-agent-devbox)
  image:
    pullPolicy: IfNotPresent

# Namespace configuration
namespaceOverride: ""

# Image pull secrets
imagePullSecrets: []

# Additional labels for all resources
commonLabels: {}

# Additional annotations for all resources
commonAnnotations: {}

# Server configuration (UI + API)
server:
  # Whether to enable the UI server
  enabled: true

  # Container image for the server (uses same image as controller)
  image:
    repository: ghcr.io/kubeopencode/kubeopencode
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # Number of server replicas
  replicas: 1

  # Service configuration
  service:
    type: ClusterIP
    port: 2746

  # Authentication configuration
  # Enable when exposing the server externally (via Ingress) for agent proxy access.
  # Uses Kubernetes TokenReview to validate Bearer tokens from kubeconfig.
  auth:
    enabled: true
    # Allow unauthenticated requests (for development only)
    allowAnonymous: false

  # Ingress configuration
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    #
    # Required for agent proxy (SSE streaming) with nginx ingress:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    hosts:
      - host: kubeopencode.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: kubeopencode-tls
    #    hosts:
    #      - kubeopencode.local

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Service account for the server
  serviceAccount:
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # Security context for server pods
  podSecurityContext:
    runAsNonRoot: true

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL

  # Node selector for server pods
  nodeSelector: {}

  # Tolerations for server pods
  tolerations: []

  # Affinity for server pods
  affinity: {}

  # Port-forward RBAC configuration
  # Creates a Role/RoleBinding to allow specific subjects to port-forward
  # the UI server (kubectl port-forward svc/kubeopencode-server).
  portForward:
    enabled: false
    # Subjects to grant port-forward access to
    # Example:
    #   subjects:
    #     - kind: ServiceAccount
    #       name: my-sa
    #       namespace: my-namespace
    #     - kind: User
    #       name: developer@example.com
    subjects: []

# KubeOpenCodeConfig - system-level configuration
# This creates a default KubeOpenCodeConfig in the release namespace
kubeopencodeConfig:
  # Whether to create the default KubeOpenCodeConfig
  create: true
  # Default coding agent runtime for the cluster.
  # Individual Agents can override this in their spec.
  # Supported: "opencode" (default), "crush"
  defaultRuntime: ""
  # System image configuration for internal components (git-init, context-init)
  systemImage:
    # Image to use (empty = use controller image)
    image: ""
    # Image pull policy
    imagePullPolicy: IfNotPresent
